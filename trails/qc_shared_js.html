<script>
// =========================================================================
// Shared QC helpers used by index_page_template.html, sample_qc_template.html,
// qc2_template.html, and swim_plot_template.html. Kept in one place so fixes to the
// box-plot stats / Mendelian-warning popup can't drift between the pages.
// Defines: escapeHtml, isAffectedStatus, ESCAPING_ADDITIONS_DROPDOWN_SETTINGS, setupDropdownMenu,
// getDropdownValue, renderMendelianWarning, medianOfSorted, computeBoxStats, computePercentile,
// jitterFromKey, singleBinBoxPlotPlugin, the QC pages' per-bin builders appendQCBinCard and
// createSingleBinBoxPlotChart, their grouping and loading helpers groupRowsByBin and
// drawQCPageOnLoad, and the Mendelian-warning popup handler.
// Page-specific pieces (MOTIF_BINS, MENDELIAN_WARNINGS, each chart's data and options) stay in each page.
// Requires Chart.js + jQuery (loaded by header_template.html) and the page-level MENDELIAN_WARNINGS
// const. renderMendelianWarning also reads OUTLIER_WARNINGS unless the page passes
// mendelianOnly: true (QC2 does, and does not define it). Both are referenced only at call time.
// =========================================================================

// HTML escaping helper
function escapeHtml(str) {
    if (str == null) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

// True for the affected_status display values the pipeline treats as affected. The server
// preserves "Possibly Affected" for display (results_server.parse_outlier_samples) while
// collapsing it to "affected" for analysis logic, and README.md documents it as treated as
// affected, so every UI that branches on affected_status has to accept both spellings.
function isAffectedStatus(status) {
    const normalized = String(status || '').trim().toLowerCase();
    return normalized === 'affected' || normalized === 'possibly affected';
}

// Settings for every dropdown that accepts typed-in values (allowAdditions: true). Semantic UI
// writes such a value into the page as HTML twice: in the "Add <b>value</b>" menu item
// (templates.addition) and in the selection's label (templates.label, for a multiple-selection
// dropdown). The results page restores #sample-id-filter from the URL, which a link can fill with
// any text (#sample_id_keyword=<img src=x onerror=...>), so both templates escape the value here.
// preserveHTML: false makes Semantic UI hand the label template a menu item's plain text rather
// than its HTML, so every label is escaped exactly once.
const ESCAPING_ADDITIONS_DROPDOWN_SETTINGS = {
    preserveHTML: false,
    message: { addResult: 'Add {term}' },
    templates: {
        addition: choice => escapeHtml(choice),
        label: (value, text) => escapeHtml(text) + '<i class="delete icon"></i>',
    },
};

// Populate a Semantic UI dropdown's menu from values that came out of the database (tags,
// sample ids), which are arbitrary user-supplied strings.
//
// Semantic UI's 'setup menu' builds its markup by string concatenation
// ('<div class="item" data-value="' + value + '">' + name + '</div>'), so an unescaped value
// containing markup executes, and one containing a double quote breaks out of the attribute.
// Escaping both fixes that, but leaves the escaped text sitting in data-value, so this then
// writes the raw strings back with .attr()/.data()/.text(), which assign literally rather than
// parsing HTML. The menu is therefore safe to build, and each item's value is the string exactly
// as stored. Read the selection back with getDropdownValue, not dropdown('get value'), which
// returns a double quote as '&quot;'.
//
// `items` is an array of {name, value} objects holding the raw, unescaped strings.
function setupDropdownMenu($dropdown, items) {
    $dropdown.dropdown('setup menu', {
        values: items.map(function(item) {
            return {
                name: escapeHtml(item.name),
                value: escapeHtml(item.value),
            };
        }),
    });
    $dropdown.find('.menu > .item').each(function(index) {
        if (!items[index]) return;
        $(this).attr('data-value', items[index].value)
               .data('value', items[index].value)
               .text(items[index].name);
    });
}

// A Semantic UI dropdown's selected value as it was chosen or typed. Semantic UI stores the value
// with every double quote replaced by '&quot;' (set.value runs it through escape.value) and
// dropdown('get value') returns that stored form, so a tag a"b would come back as a&quot;b, be
// saved that way and match nothing as a filter. A multiple dropdown's value is a comma-separated
// string of its selections.
function getDropdownValue($dropdown) {
    return String($dropdown.dropdown('get value') || '').replace(/&quot;/g, '"');
}

// Helper function to render warning icon if sample has warnings: its Mendelian-violation warning
// (MENDELIAN_WARNINGS) and its 99th-percentile outlier warning (OUTLIER_WARNINGS, which the page
// defines unless it passes mendelianOnly: true, as the QC2 page does to show only the first).
function renderMendelianWarning(sampleId, { mendelianOnly = false } = {}) {
    if (!sampleId) return '';
    const mendelian = MENDELIAN_WARNINGS[sampleId];
    const outlier = mendelianOnly ? undefined : OUTLIER_WARNINGS[sampleId];
    if (!mendelian && !outlier) return '';
    const w = Object.assign({}, mendelian || {}, outlier || {});
    // Determine tooltip text based on warning types
    const hasMendelian = w.autosome_rate !== undefined;
    const hasOutlier = w.outlier_bins !== undefined;
    let tooltip = '';
    if (hasMendelian && hasOutlier) {
        tooltip = 'High Mendelian violation rate; TR outlier';
    } else if (hasMendelian) {
        tooltip = 'High Mendelian violation rate';
    } else if (hasOutlier) {
        tooltip = '99th percentile TR outlier';
    }
    return `<i class="warning sign icon mendelian-warning-icon"
               title="${tooltip}"
               data-warning='${JSON.stringify(w).replace(/'/g, "&apos;")}'
               data-sample-id="${escapeHtml(sampleId)}"></i>`;
}

// The median of an array sorted ascending, or null when it is empty
function medianOfSorted(sorted) {
    const n = sorted.length;
    if (n === 0) return null;
    return n % 2 === 0 ? (sorted[n / 2 - 1] + sorted[n / 2]) / 2 : sorted[Math.floor(n / 2)];
}

// Compute box plot statistics for an array of values sorted ascending
function computeBoxStats(sorted) {
    if (!sorted || sorted.length === 0) {
        return { min: null, q1: null, median: null, q3: null, max: null };
    }
    const n = sorted.length;
    const median = medianOfSorted(sorted);

    // Q1 and Q3: the medians of the lower and upper halves (an odd count's middle value is in
    // neither), or the median itself when the halves are empty (a single value)
    const q1 = medianOfSorted(sorted.slice(0, Math.floor(n / 2))) ?? median;
    const q3 = medianOfSorted(sorted.slice(Math.ceil(n / 2))) ?? median;

    // Whiskers: 1.5 * IQR
    const iqr = q3 - q1;
    const whiskerLow = q1 - 1.5 * iqr;
    const whiskerHigh = q3 + 1.5 * iqr;

    // Actual whisker values are min/max within the whisker bounds. Use ?? (not
    // ||) for the fallback so a legitimate whisker value of 0 is not treated as
    // missing (|| would discard it and draw the whisker at the array boundary).
    const minVal = sorted.find(v => v >= whiskerLow) ?? sorted[0];
    const maxVal = sorted.slice().reverse().find(v => v <= whiskerHigh) ?? sorted[n - 1];

    return { min: minVal, q1: q1, median: median, q3: q3, max: maxVal };
}

// Compute percentile value from sorted array
function computePercentile(sortedValues, percentile) {
    if (!sortedValues || sortedValues.length === 0) return null;
    const index = (percentile / 100) * (sortedValues.length - 1);
    const lower = Math.floor(index);
    const upper = Math.ceil(index);
    if (lower === upper) return sortedValues[lower];
    return sortedValues[lower] + (sortedValues[upper] - sortedValues[lower]) * (index - lower);
}

// A fixed offset in [-width / 2, width / 2) for a chart dot, from an FNV-1a hash of `key`, a
// string that identifies the dot. The scatter charts spread their dots by this rather than by
// Math.random(), so a redraw of the same data (e.g. the swim plot's x-axis toggle) leaves every
// dot where it was.
function jitterFromKey(key, width) {
    let hash = 0x811c9dc5;
    for (let i = 0; i < key.length; i++) {
        hash = Math.imul(hash ^ key.charCodeAt(i), 0x01000193);
    }
    // MurmurHash3's final mix, so keys that differ only in their last characters (sample ids
    // like S1, S2, ...) still spread evenly over the whole range
    hash = Math.imul(hash ^ (hash >>> 16), 0x85ebca6b);
    hash = Math.imul(hash ^ (hash >>> 13), 0xc2b2ae35);
    hash ^= hash >>> 16;
    return ((hash >>> 0) / 0x100000000 - 0.5) * width;
}

// Custom plugin to draw box plot for a single bin (centered at x=0)
const singleBinBoxPlotPlugin = {
    id: 'singleBinBoxPlotDrawer',
    afterDatasetsDraw: function(chart) {
        const ctx = chart.ctx;
        const stats = chart.config._boxStats;
        if (!stats || stats.median === null) return;

        const xScale = chart.scales.x;
        const yScale = chart.scales.y;
        const boxWidth = 40;
        const chartArea = chart.chartArea;

        ctx.save();

        // Draw percentile lines first (behind box plot)
        const percentiles = chart.config._percentiles;
        if (percentiles) {
            const lineConfigs = [
                { value: percentiles.p95, color: '#f9a825', label: '95%' },  // Yellow
                { value: percentiles.p99, color: '#c62828', label: '99%' }   // Red
            ];

            ctx.setLineDash([4, 4]);
            ctx.lineWidth = 1.5;

            lineConfigs.forEach(config => {
                if (config.value != null) {
                    const yPixel = yScale.getPixelForValue(config.value);
                    ctx.strokeStyle = config.color;
                    ctx.beginPath();
                    ctx.moveTo(chartArea.left, yPixel);
                    ctx.lineTo(chartArea.right, yPixel);
                    ctx.stroke();

                    // Draw label on right side
                    ctx.fillStyle = config.color;
                    ctx.font = '9px sans-serif';
                    ctx.textAlign = 'left';
                    ctx.fillText(config.label, chartArea.right + 2, yPixel + 3);
                }
            });

            ctx.setLineDash([]);
        }

        ctx.lineWidth = 1.5;
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.6)';
        ctx.fillStyle = 'rgba(200, 200, 200, 0.4)';

        const x = xScale.getPixelForValue(0);
        const yMin = yScale.getPixelForValue(stats.min);
        const yQ1 = yScale.getPixelForValue(stats.q1);
        const yMedian = yScale.getPixelForValue(stats.median);
        const yQ3 = yScale.getPixelForValue(stats.q3);
        const yMax = yScale.getPixelForValue(stats.max);

        // Draw box (Q1 to Q3)
        ctx.fillRect(x - boxWidth / 2, yQ3, boxWidth, yQ1 - yQ3);
        ctx.strokeRect(x - boxWidth / 2, yQ3, boxWidth, yQ1 - yQ3);

        // Draw median line
        ctx.beginPath();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.8)';
        ctx.moveTo(x - boxWidth / 2, yMedian);
        ctx.lineTo(x + boxWidth / 2, yMedian);
        ctx.stroke();

        // Draw whiskers
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.5)';

        // Lower whisker
        ctx.beginPath();
        ctx.moveTo(x, yQ1);
        ctx.lineTo(x, yMin);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x - boxWidth / 4, yMin);
        ctx.lineTo(x + boxWidth / 4, yMin);
        ctx.stroke();

        // Upper whisker
        ctx.beginPath();
        ctx.moveTo(x, yQ3);
        ctx.lineTo(x, yMax);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x - boxWidth / 4, yMax);
        ctx.lineTo(x + boxWidth / 4, yMax);
        ctx.stroke();

        ctx.restore();
    }
};

Chart.register(singleBinBoxPlotPlugin);

// Append one bin's card to a QC page's row of charts (Sample QC, QC2): the bin name over an empty
// canvas for its chart, then, when tableRows is not empty, a table titled tableTitle. tableRows
// holds the inner HTML of each table row. Returns the canvas id, which the chart is drawn into
// once the card is in the DOM.
function appendQCBinCard(container, binIndex, bin, tableTitle, tableHeaderHtml, tableRows) {
    const chartWrapper = document.createElement('div');
    chartWrapper.className = 'qc-chart-container';

    const label = document.createElement('div');
    label.className = 'qc-bin-label';
    label.textContent = bin;

    // Canvas wrapper for fixed height
    const canvasWrapper = document.createElement('div');
    canvasWrapper.className = 'qc-chart-canvas-wrapper';

    const canvas = document.createElement('canvas');
    canvas.id = `${container.id}-chart-${binIndex}`;

    canvasWrapper.appendChild(canvas);
    chartWrapper.appendChild(label);
    chartWrapper.appendChild(canvasWrapper);

    if (tableRows.length > 0) {
        const tableTitleDiv = document.createElement('div');
        tableTitleDiv.className = 'qc-table-title';
        tableTitleDiv.textContent = tableTitle;

        const table = document.createElement('table');
        table.className = 'qc-top-table';

        const thead = document.createElement('thead');
        thead.innerHTML = tableHeaderHtml;
        table.appendChild(thead);

        const tbody = document.createElement('tbody');
        tableRows.forEach(rowHtml => {
            const tr = document.createElement('tr');
            tr.innerHTML = rowHtml;
            tbody.appendChild(tr);
        });
        table.appendChild(tbody);

        chartWrapper.appendChild(tableTitleDiv);
        chartWrapper.appendChild(table);
    }

    container.appendChild(chartWrapper);
    return canvas.id;
}

// Draw one bin's chart on a QC page: a box plot of the points' y values (singleBinBoxPlotPlugin,
// with its 95th and 99th percentile lines) behind one dot per point, jittered sideways around
// x = 0. Each point is {y, ...} plus whatever fields options.tooltipLines reads. The options are
// what the pages' charts differ in:
//   datasetLabel, backgroundColor, borderColor, pointRadius, pointHoverRadius: the dots;
//   yAxisTitle, yAxisRange (e.g. {beginAtZero: true} or {min: 0, max: yMax}) and the optional
//   yTickLabel(value) callback: the y axis;
//   tooltipLines(point): the lines of a dot's tooltip.
function createSingleBinBoxPlotChart(canvasId, points, options) {
    const ctx = document.getElementById(canvasId).getContext('2d');

    const yTicks = { font: { size: 10 }, maxTicksLimit: 6 };
    if (options.yTickLabel) yTicks.callback = options.yTickLabel;

    const chart = new Chart(ctx, {
        type: 'scatter',
        data: {
            datasets: [{
                label: options.datasetLabel,
                // jitter between -0.3 and 0.3, the same for a given point on every load
                data: points.map(point => Object.assign({ x: jitterFromKey(JSON.stringify(point), 0.6) }, point)),
                backgroundColor: options.backgroundColor,
                borderColor: options.borderColor,
                pointRadius: options.pointRadius,
                pointHoverRadius: options.pointHoverRadius
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            // Room right of the chart area for the '95%' / '99%' labels singleBinBoxPlotPlugin
            // draws 2px past its right edge (about 18px wide in its 9px font); without it they
            // fall outside the canvas and are cut off
            layout: { padding: { right: 22 } },
            scales: {
                x: {
                    type: 'linear',
                    min: -0.8,
                    max: 0.8,
                    display: false,  // Hide x-axis since it's just jitter
                    grid: { display: false }
                },
                y: Object.assign({
                    title: {
                        display: true,
                        text: options.yAxisTitle,
                        font: { size: 11 }
                    },
                    ticks: yTicks
                }, options.yAxisRange)
            },
            plugins: {
                legend: { display: false },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            return options.tooltipLines(context.raw);
                        }
                    }
                }
            }
        }
    });

    // Store box stats and percentiles for the custom plugin, from one sorted copy of the values
    const sortedValues = points.map(point => point.y).sort((a, b) => a - b);
    chart.config._boxStats = computeBoxStats(sortedValues);
    chart.config._percentiles = {
        p95: computePercentile(sortedValues, 95),
        p99: computePercentile(sortedValues, 99)
    };

    return chart;
}

// The rows of a QC section grouped by their bin: {bin: [rows]} for each name in bins, in that
// order. A row whose bin is not listed is left out.
function groupRowsByBin(rows, bins) {
    const rowsByBin = {};
    bins.forEach(bin => { rowsByBin[bin] = []; });
    rows.forEach(row => {
        if (rowsByBin[row.bin] !== undefined) rowsByBin[row.bin].push(row);
    });
    return rowsByBin;
}

// Once a QC page (Sample QC, QC2) has loaded, fetch its data from API_BASE_URL/endpoint, hide the
// loading indicator, show the sections whose element ids are in sectionIds and call
// drawSections(data). If the request or the drawing fails, the indicator gives way to
// "Failed to load <dataName>: <message>" in #qc-error.
function drawQCPageOnLoad(endpoint, dataName, sectionIds, drawSections) {
    document.addEventListener('DOMContentLoaded', async function() {
        try {
            const response = await fetch(`${API_BASE_URL}/${endpoint}`);
            if (!response.ok) throw await errorFromResponse(response);
            const data = await response.json();

            document.getElementById('qc-loading').style.display = 'none';
            sectionIds.forEach(id => { document.getElementById(id).style.display = 'block'; });
            drawSections(data);
        } catch (err) {
            console.error(`Load ${dataName} error:`, err);
            document.getElementById('qc-loading').style.display = 'none';
            document.getElementById('qc-error').style.display = 'block';
            document.getElementById('qc-error').textContent = `Failed to load ${dataName}: ` + err.message;
        }
    });
}

// Warning icon click handler — show violation rates and/or outlier info popup
document.addEventListener('click', function(e) {
    const icon = e.target.closest('.mendelian-warning-icon');
    if (!icon) {
        // Click outside the icon - close the popup, unless the click was inside the popup
        // itself (so the user can select / highlight / copy its contents).
        if (e.target.closest('.mendelian-warning-popup')) return;
        const existingPopup = document.querySelector('.mendelian-warning-popup');
        if (existingPopup) existingPopup.remove();
        return;
    }

    e.stopPropagation();
    const sampleId = icon.dataset.sampleId;
    let warning;
    try {
        warning = JSON.parse(icon.dataset.warning);
    } catch (err) {
        return;
    }
    if (!warning) return;

    // Remove any existing popup
    const existingPopup = document.querySelector('.mendelian-warning-popup');
    if (existingPopup) existingPopup.remove();

    // A rate as a percentage. The server flags a sample when its autosome or chrX rate is above
    // MENDELIAN_VIOLATION_RATE_WARNING_THRESHOLD (0.10, results_server.py), so formatRate highlights
    // those two rows above it; the chrY and motif-size rows are shown for context, never highlighted.
    const formatPercent = rate => (rate * 100).toFixed(1) + '%';
    const formatRate = rate => rate > 0.10 ? `<span class="high-rate">${formatPercent(rate)}</span>` : formatPercent(rate);

    // Determine warning types
    const hasMendelian = warning.autosome_rate !== undefined;
    const hasOutlier = warning.outlier_bins !== undefined;

    // Build popup HTML
    let html = '<div class="mendelian-warning-popup">';
    html += `<div style="font-size: 0.9em; color: #666; margin-bottom: 6px;">Sample: <b>${escapeHtml(sampleId)}</b></div>`;

    // Mendelian violation section
    if (hasMendelian) {
        html += `<div class="popup-header">⚠️ High Mendelian Violation Rate</div>`;
        html += '<table class="invisible-table">';
        html += `<tr><td style="font-weight:600;color:#555;">Autosome</td><td style="text-align:right;">${formatRate(warning.autosome_rate)}</td><td style="color:#888;">(${warning.autosome_violations.toLocaleString()} / ${warning.autosome_total.toLocaleString()})</td></tr>`;
        html += `<tr><td style="font-weight:600;color:#555;">chrX</td><td style="text-align:right;">${formatRate(warning.chrX_rate)}</td><td style="color:#888;">(${warning.chrX_violations.toLocaleString()} / ${warning.chrX_total.toLocaleString()})</td></tr>`;
        html += `<tr><td style="font-weight:600;color:#555;">chrY</td><td style="text-align:right;">${formatPercent(warning.chrY_rate)}</td><td style="color:#888;">(${warning.chrY_violations.toLocaleString()} / ${warning.chrY_total.toLocaleString()})</td></tr>`;
        html += '</table>';

        // Motif size breakdown for Mendelian
        if (warning.motif_rates && Object.keys(warning.motif_rates).length > 0) {
            html += '<div class="motif-section">';
            html += '<div class="motif-section-header">By Motif Size</div>';
            html += '<div class="motif-grid">';
            // Keyed by the bin labels the server shows (MENDELIAN_MOTIF_SIZE_BINS in results_server.py)
            for (const [label, data] of Object.entries(warning.motif_rates)) {
                html += `<div class="motif-item"><span>${escapeHtml(label)}:</span><span>${formatPercent(data.rate)}</span></div>`;
            }
            html += '</div></div>';
        }
    }

    // Outlier section
    if (hasOutlier) {
        if (hasMendelian) html += '<hr style="margin: 10px 0; border: none; border-top: 1px solid #ddd;">';
        html += `<div class="popup-header">⚠️ 99th Percentile TR Outlier</div>`;
        html += '<table class="invisible-table">';
        html += '<tr><th style="font-weight:600;color:#555;">Bin</th><th style="text-align:right;font-weight:600;color:#555;padding-right:8px;">Count</th><th style="text-align:left;color:#888;">Threshold</th></tr>';
        // 'Unknown' is the bin results_server.compute_sample_qc_data emits for loci whose
        // MotifSize is NULL or <= 0; without it a sample flagged only there gets an empty table.
        const binOrder = ['1bp', '2bp', '3-6bp', '7-24bp', '25+bp', 'Unknown'];
        for (const bin of binOrder) {
            if (warning.outlier_bins[bin]) {
                const data = warning.outlier_bins[bin];
                html += `<tr><td style="font-weight:600;color:#555;">${bin}</td><td style="text-align:right;padding-right:8px;"><span class="high-rate">${data.count}</span></td><td style="text-align:left;color:#888;">&ge; ${data.threshold}</td></tr>`;
            }
        }
        html += '</table>';
    }
    html += '</div>';

    const popup = document.createElement('div');
    popup.innerHTML = html;
    const popupEl = popup.firstChild;
    document.body.appendChild(popupEl);
    const rect = icon.getBoundingClientRect();
    popupEl.style.top = (rect.bottom + window.scrollY + 4) + 'px';
    popupEl.style.left = (rect.left + window.scrollX) + 'px';
});
</script>
