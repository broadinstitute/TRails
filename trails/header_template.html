<head>
<title>TR Outlier Analysis</title>
<!-- Each integrity value is the sha384 of that exact file version, so the browser refuses a CDN
     file whose content changed. -->
<link rel="stylesheet" type="text/css"
      href="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.5.0/semantic.min.css"
      integrity="sha384-MC/DuDYHQs0NorkJdvxXwZeSFDEhHVVrH/XQ/7JQAKKDazcvpRQ7feYib4xf32ZT" crossorigin="anonymous">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha384-1H217gwSVyLSIfaLxHbE7dRb3v4mYCKbpQvzx0cegeju1MVsGrX5xXxAvs/HgeFs" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.5.0/semantic.min.js"
        integrity="sha384-J90C/4H4FEvN97dzFx745RBJDfRe8Lt+DQaL3uLYunPE2dagUsllBeEn5aZa4w8M" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"
        integrity="sha384-9nhczxUqK87bcKHh20fSQcTGD4qq5GhayNYSYWqwBkINBhOfQLg/P5HG5lF1urn4" crossorigin="anonymous"></script>

<script>
// Every page includes this header. API_BASE_URL is used by all of them; the rest is used by
// index_page_template.html and swim_plot_template.html.

// The results server's API
const API_BASE_URL = window.location.origin + '/api/v1';

// URL of a locus's full detail
function buildLocusDetailUrl(locusId) {
    return `${API_BASE_URL}/loci/${encodeURIComponent(locusId)}`;
}

// TRExplorer columns the locus links open with (TRExplorer's showColumns URL parameter)
const TREXPLORER_LINK_COLUMNS = [
    'ReferenceRegion', 'ReferenceMotif', 'ReferenceRepeatPurity', 'variationCluster',
    'GencodeGeneName', 'GencodeGeneRegion', 'VamosMotifFrequencies', 'HPRC256_AlleleHistogram',
    'HPRC256_Stdev', 'AoU1027_Stdev', 'Source', 'RepeatMaskerIntervals', 'NonCodingAnnotations',
    'Tanudisastro2024_SignificantCellTypes', 'Manigbas2024_AssociatedTraits', 'encode4MpraExpression',
    'zhang2025Mpra', 'spliceAI',
];

// TRExplorer URL for a locus: its IGV view, the search for its TRExplorer locus id (or, without one,
// this database's chrom-start-end-motif), the IGV tracks and the columns above. Returns '' when the
// locus has no coordinates.
function buildTRExplorerUrl(locus) {
    if (!locus.Chrom || locus.Start0Based == null || locus.End1Based == null) return '';
    const chromNum = locus.Chrom.replace('chr', '');
    const trexLocusId = locus.TRExplorerLocusId || `${chromNum}-${locus.Start0Based}-${locus.End1Based}-${locus.Motif || ''}`;
    const igvLoc = encodeURIComponent(`${locus.Chrom}:${locus.Start0Based}-${locus.End1Based}`);
    return `https://trexplorer.broadinstitute.org/#igvLoc=${igvLoc}&showRs=1&q=${encodeURIComponent(trexLocusId)}`
        + '&source=&igv_gencode=1&igv_segdups=1&igv_36k_map=1&igv_ncannot=1'
        + `&showColumns=${encodeURIComponent(TREXPLORER_LINK_COLUMNS.join(','))}`;
}

// UCSC Genome Browser URL for a locus (hg38, 1-based start), or '' when the locus has no coordinates
function buildUcscUrl(locus) {
    if (!locus.Chrom || locus.Start0Based == null || locus.End1Based == null) return '';
    return 'https://genome.ucsc.edu/cgi-bin/hgTracks?db=hg38&position='
        + encodeURIComponent(`${locus.Chrom}:${locus.Start0Based + 1}-${locus.End1Based}`);
}

// The population cohorts a locus's population_thresholds and columns are keyed by
// ('<cohort>_MaxAllele' etc.), in display order: results_server.py's POPULATION_DATASETS
const POPULATION_COHORTS = ['HPRC256', 'AoU1027', 'TenK10K'];

// The outlier_type parameter value -> the suffix of that outlier type's columns and keys
// (OutlierSampleIds_AllAlleles, ...): results_server.py's OUTLIER_TYPE_MAP
const OUTLIER_TYPE_MAP = {all: 'AllAlleles', short: 'ShortAlleles', hemi: 'HemizygousAlleles'};

// The gene_regions / exclude_gene_regions filter values, one include and one exclude checkbox
// each on both pages: results_server.py's GENE_REGION_MAP keys
const GENE_REGIONS = ['cds', 'promoter', 'utr', 'intron', 'exon', 'intergenic'];

// Make each gene region's include and exclude checkboxes mutually exclusive: checking one
// unchecks the other. namePrefix is what the page puts before the checkbox names
// ('<namePrefix>gene_region_cds', '<namePrefix>exclude_gene_region_cds', ...).
function linkGeneRegionIncludeAndExcludeCheckboxes(namePrefix) {
    const includePrefix = `${namePrefix}gene_region_`;
    const excludePrefix = `${namePrefix}exclude_gene_region_`;
    for (const [changedPrefix, otherPrefix] of [[includePrefix, excludePrefix], [excludePrefix, includePrefix]]) {
        $(`input[name^="${changedPrefix}"]`).on('change', function() {
            const region = this.name.slice(changedPrefix.length);
            if ($(this).parent().checkbox('is checked')) {
                $(`input[name="${otherPrefix}${region}"]`).parent().checkbox('uncheck');
            }
        });
    }
}

// GET a JSON API response, or null when the request fails or the server answers with an error
// status (logged to the console under `description`), so a failed request leaves the page's
// menus as they were instead of emptying them.
async function fetchJsonOrNull(url, description) {
    try {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return await response.json();
    } catch (e) {
        console.error(`${description} error:`, e);
        return null;
    }
}

// Fill a sample-ID filter dropdown from an /api/v1/schema response
function fillSampleIdDropdown($dropdown, schema) {
    setupDropdownMenu($dropdown, (schema.sample_ids || []).map(id => ({ name: id, value: id })));
}

// A locus's note and tags
const ANNOTATIONS_API_URL = `${API_BASE_URL}/annotations`;

// The annotation write routes explain every failure in the response body: a "detail" field for
// the read-only-server 403 (the results_server.restrict_writes before_request hook) and an "error" field for the
// validation failures, so surface that text instead of a bare status number. The callers show
// e.message in an alert.
async function annotationError(response) {
    const body = await response.json().catch(() => ({}));
    return new Error(body.detail || body.error || `HTTP ${response.status}`);
}

async function saveNote(locusId, noteText) {
    const response = await fetch(`${ANNOTATIONS_API_URL}/${encodeURIComponent(locusId)}/note`, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({note_text: noteText}),
    });
    if (!response.ok) throw await annotationError(response);
    return response.json();
}

async function deleteNote(locusId) {
    const response = await fetch(`${ANNOTATIONS_API_URL}/${encodeURIComponent(locusId)}/note`, {
        method: 'DELETE',
    });
    if (!response.ok) throw await annotationError(response);
    return response.json();
}

async function addTag(locusId, tag) {
    const response = await fetch(`${ANNOTATIONS_API_URL}/${encodeURIComponent(locusId)}/tags`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({tag: tag}),
    });
    if (!response.ok) throw await annotationError(response);
    return response.json();
}

async function removeTag(locusId, tag) {
    const response = await fetch(`${ANNOTATIONS_API_URL}/${encodeURIComponent(locusId)}/tags/${encodeURIComponent(tag)}`, {
        method: 'DELETE',
    });
    if (!response.ok) throw await annotationError(response);
    return response.json();
}

// Fill a tag filter dropdown, and the cached tag list the add-tag modal and prompts offer
// (window._allTagsList), from /api/v1/annotations/tags, keeping the dropdown's current selection.
// Runs at startup and after every tag change, so a tag added or removed is selectable in the
// filter right away.
async function refreshTagFilterDropdown($dropdown) {
    const data = await fetchJsonOrNull(`${ANNOTATIONS_API_URL}/tags`, 'Load tags');
    if (!data) return;
    window._allTagsList = data.tags || [];
    const selected = $dropdown.dropdown('get value');
    // Raw, unescaped strings: setupDropdownMenu (qc_shared_js.html) is what makes them safe to
    // render while keeping data-value equal to the stored tag.
    setupDropdownMenu($dropdown, window._allTagsList.map(tag => ({ name: tag, value: tag, selected: tag === selected })));
    if (selected) $dropdown.dropdown('set selected', selected);
}

// The note editor (#edit-note-modal, at the end of this header): a multi-line textarea, so a note
// keeps its line breaks. onNoteChanged(locusId) runs after a save or a delete, so the page can
// repaint whatever shows the note.
//
// The modal is shared, with one textarea and one locus id, so a slow note fetch for an earlier
// locus must not fill it after the user has opened a different one: only the newest open commits
// its response.
let noteEditorSeq = 0;
let noteEditorOnNoteChanged = null;

async function openNoteEditor(locusId, onNoteChanged) {
    const $modal = $('#edit-note-modal');
    const $textarea = $('#note-textarea');
    const $existingSection = $('#existing-note-section');
    const seq = ++noteEditorSeq;

    // Fetch the locus's stored note. The editor must not open until that text is known: Save
    // replaces the stored note with whatever the textarea holds, so an empty textarea shown over
    // an existing note destroys it on save.
    try {
        const response = await fetch(`${ANNOTATIONS_API_URL}/${encodeURIComponent(locusId)}`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        if (seq !== noteEditorSeq) return;  // a newer open already owns the modal

        // Store locusId on modal for the save and delete handlers, together with the text it belongs to.
        $modal.data('locus-id', locusId);
        noteEditorOnNoteChanged = onNoteChanged;
        if (data.note && data.note.note_text) {
            $textarea.val(data.note.note_text);
            $('#note-updated-at').text(data.note.updated_at || '');
            $existingSection.show();
        } else {
            $textarea.val('');
            $existingSection.hide();
        }
    } catch (e) {
        if (seq !== noteEditorSeq) return;
        // Deliberately no empty-editor fallback: the locus may well have a note, and saving over
        // it would replace it with whatever the user typed. Report the failure and stay closed.
        console.error('Load note error:', e);
        alert('Failed to load the existing note: ' + e.message + '\n\nThe note was not opened for editing.');
        return;
    }

    $modal
        .modal({
            // The swim plot opens the editor over its detail modal, which stays open underneath
            allowMultiple: true,
            onApprove: function() {
                const noteText = $textarea.val().trim();
                const currentLocusId = $modal.data('locus-id');

                if (!noteText) {
                    // If empty, just close (don't save empty note)
                    return true;
                }

                // Semantic UI reads this return value synchronously, and an async function hands
                // it a Promise, which is truthy: the modal would close before the save resolved,
                // and a failed save would discard what the user typed. Hold the modal open and
                // close it once the save succeeds.
                saveNote(currentLocusId, noteText).then(function() {
                    noteEditorOnNoteChanged(currentLocusId);
                    $modal.modal('hide');
                }).catch(function(e) {
                    alert('Failed to save note: ' + e.message);
                });
                return false;
            },
            // No onHidden reset: the textarea and the existing-note section are set above before
            // every show, and a reset there would run when the hide animation ends, which can be
            // after a quick reopen has already filled the editor with the stored note.
        })
        .modal('show');
}

// Delete note button inside the note editor
$(document).on('click', '#delete-note-btn', async function() {
    const locusId = $('#edit-note-modal').data('locus-id');

    if (!confirm('Delete this note?')) return;

    try {
        await deleteNote(locusId);

        // Clear the modal UI
        $('#note-textarea').val('');
        $('#existing-note-section').hide();

        noteEditorOnNoteChanged(locusId);
    } catch (e) {
        alert('Failed to delete note: ' + e.message);
    }
});
</script>

<style>
/* === Page Layout === */
body {
    padding: 0; margin: 0;
    font-family: Lato, "Helvetica Neue", Arial, Helvetica, sans-serif;
    width: 100%;
}

/* === Header Bar === */
#header-stripe {
    background-color: #1b1c1d;
    color: white;
    padding: 15px 0;
}
#header-stripe .ui.grid {
    margin-top: 0; margin-bottom: 0;
}
#header-stripe .ui.grid > .column {
    padding-top: 0; padding-bottom: 0;
}
#header-stripe {
    position: relative;
}
#header-stripe .header-inner {
    display: flex;
    align-items: center;
}
#header-title {
    font-size: 20px;
    font-weight: 700;
    color: white;
}

/* === Filter Panel === */
#filter-panel {
    background: #f9fafb;
    border: 1px solid #e0e0e0;
    border-radius: 6px;
    padding: 20px;
    margin-bottom: 20px;
    margin-top: 20px;
}
#filter-panel .field { margin-bottom: 12px; }
#filter-panel label { font-weight: 700; font-size: 0.93em; }

.radio-group {
    display: flex; gap: 15px; flex-wrap: wrap; align-items: center;
}
.radio-group .ui.radio.checkbox { margin-right: 5px; }

.checkbox-group {
    display: flex; gap: 18px; flex-wrap: wrap;
}
.checkbox-group .ui.checkbox { padding-right: 5px; }

/* Multi-key sort: draggable priority pills */
.sort-by-control {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px;
}
.sort-pills { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; min-height: 24px; }
.sort-pill {
    display: inline-flex; align-items: center; gap: 5px;
    background: #2185d0; color: #fff; border-radius: 4px;
    padding: 3px 8px; font-size: 0.85em; cursor: grab; user-select: none;
}
.sort-pill.drag-over { outline: 2px dashed #1b6fb3; outline-offset: 1px; }
.sort-pill .pill-order { opacity: 0.7; font-weight: 700; }
.sort-pill .pill-remove { cursor: pointer; opacity: 0.8; font-weight: 700; }
.sort-pill .pill-remove:hover { opacity: 1; }
.sort-pills-empty { color: #999; font-size: 0.85em; font-style: italic; }

/* === Results Table === */
#results-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 1.0em;
    table-layout: fixed;
}
#results-table thead th {
    position: sticky;
    top: 0;
    z-index: 2;
    background: #f9fafb;
    border-bottom: 2px solid #ddd;
    padding: 6px 8px;
    text-align: left;
    font-weight: 600;
    font-size: 0.95em;
    color: #555;
    user-select: none;
    white-space: nowrap;
}
/* Only columns with a data-sort attribute are actually sortable (the click handler
   binds to th[data-sort]), so scope the clickable affordance to those headers. */
#results-table thead th[data-sort],
#results-table thead th[data-group-sort] { cursor: pointer; }
#results-table thead th[data-sort]:hover,
#results-table thead th[data-group-sort]:hover { color: #000; }
#results-table thead th .sort-icon { color: #bbb; margin-left: 3px; font-size: 0.8em; }
/* Each sortable field's direction is fixed on the server (SORT_MAPPING in results_server.py:
   Region ascends, the rest descend) and a header click only adds or removes that field from the
   sort list, so the indicator marks a column as part of the active sort instead of naming a
   direction. That is also what the static up-down glyph in the header says. The grouped views'
   header (Group Results By) marks its one sorted column the same way; the ASC / DESC radios next
   to the group sort menu name that column's direction. */
#results-table thead th.sorted-active .sort-icon { color: #333; }

/* Right-align numeric columns */
#results-table .col-numeric { text-align: right; }

/* Column widths */
#results-table .col-row-num   { width: 36px; text-align: center; color: #999; }
#results-table .col-expand    { width: 28px; text-align: center; cursor: pointer; }
#results-table .col-locus     { width: 200px; }
#results-table .col-motif     { width: 110px; }
#results-table .col-region    { width: 80px; }
#results-table .col-gene      { width: 140px; }
#results-table .col-allele    { width: 70px; }
#results-table .col-delta-ref { width: 65px; }
#results-table .col-delta-pop { width: 65px; }
#results-table .col-aff-unsolved { width: 55px; }
#results-table .col-fam-unsolved { width: 55px; }
#results-table .col-inheritance  { width: 60px; }
#results-table .col-gene-pheno   { width: 180px; }
#results-table .col-pli       { width: 50px; }
#results-table .col-sigma-hprc { width: 105px; }
#results-table .col-sigma-aou  { width: 105px; }
#results-table .col-vc        { width: 100px; white-space: nowrap; }
#results-table .col-gene-pheno-sim { width: 85px; }
#results-table .col-pairwise-sim   { width: 95px; }
#results-table .col-selected-allele { width: 80px; }

/* The Group Results By sort dropdown (a compact Semantic UI selection dropdown, so as wide as the
   chosen text): Semantic UI fixes a selection menu to the dropdown's width and wraps its items,
   so let the menu grow to its longest item and keep every item on one line */
#group-sort-dropdown { margin-left: 4px; }
#group-sort-dropdown .menu { width: auto; }
#group-sort-dropdown .menu > .item { white-space: nowrap; }

/* Grouped views (Group Results By): one row per sample or family, expanding to its loci */
#results-table .col-group-expand { width: 28px; text-align: center; cursor: pointer; }
#results-table .col-group-id { width: 190px; }
#results-table .col-group-members { width: 260px; }
#results-table .col-group-family { width: 150px; }
#results-table .col-group-sex { width: 60px; }
#results-table .col-group-status { width: 150px; }
/* A width of its own: in the fixed layout an unsized column only gets the space the others leave,
   which is none at common screen widths */
#results-table .col-group-phenotype { width: 240px; }
#results-table .col-group-num-loci,
#results-table .col-group-disease-genes { width: 100px; }
#results-table .col-group-gene-pheno { width: 125px; }
#results-table .col-group-largest-allele { width: 230px; }
#results-table tr.group-row { border-bottom: 1px solid #eee; }
#results-table tr.group-detail-row > td { padding: 8px 10px 14px 28px; background: #fafafa; border-bottom: 2px solid #2185d0; }
#results-table .group-loci-table { width: 100%; }
/* Like the per-sample sub-table's, this nested header would otherwise inherit the main table's
   sticky positioning and draw over the main header while scrolling */
#results-table .group-loci-table thead th { position: static; }
#results-table .group-loci-pager { margin-bottom: 6px; color: #555; }
#results-table .group-loci-pager .button { margin-left: 6px; }
/* Under a grouped row, that row's sample (or its family's samples) in a locus's per-sample table */
#results-table tbody tr.locus-detail-row tr.selected-group-sample > td { background-color: #fff3cd; }

/* Data rows */
#results-table tbody tr.locus-row {
    border-bottom: 1px solid #eee;
}
#results-table tbody tr.locus-row:hover {
    background: #f8f9ff;
}
#results-table tbody td {
    padding: 5px 8px;
    vertical-align: top;
    line-height: 1.4;
}

/* Multi-line cell sub-lines */
.cell-main { font-weight: 600; }
.cell-sub  { font-size: 0.9em; color: #888; }

/* Expand/collapse chevron */
.expand-toggle {
    cursor: pointer;
    color: #888;
    display: inline-block;
    user-select: none;
}
.expand-toggle .icon {
    margin: 0;
}

/* Expanded detail row. The child combinator matters: the row's single cell holds the per-sample
   sub-table and the Affected Unsolved summary table, and a descendant selector here (1 id, 1
   class, 3 types) would out-specify the compact `.sample-subtable td`, `.threshold-marker` and
   `.invisible-table td` rules below, re-indenting every nested cell by 40px and drawing the 2px
   rule under each sample row. */
#results-table tbody tr.locus-detail-row > td {
    padding: 10px 14px 10px 40px;
    background: #fafafa;
    border-bottom: 2px solid #ddd;
}

/* === Threshold markers inside detail expansion === */
.threshold-marker {
    border-top: 2px dashed;
    padding: 2px 6px;
    font-size: inherit;
    font-style: italic;
    margin: 2px 0;
}
.threshold-unaffected { border-color: #43a047; color: #2e8b39; }
.threshold-population { border-color: #2196f3; color: #1565c0; }
.threshold-pathogenic { border-color: #ef5350; color: #c62828; }

/* === Gene Region Badges === */
.badge {
    display: inline-block; padding: 1px 5px;
    border-radius: 2px; font-size: 0.8em;
    font-weight: 600;
}
.badge-cds         { background: #fce4ec; color: #c62828; }
.badge-promoter    { background: #e3f2fd; color: #1565c0; }
.badge-utr         { background: #fff3e0; color: #e65100; }

    background: #ffcdd2;

}

    position: absolute; z-index: 1000;
    background: #fff; border: 1px solid #ccc; border-radius: 4px;

    border-top: 1px solid #ddd;
}
.mendelian-warning-popup .motif-section-header {
    font-weight: 600;
    color: #666;
    font-size: 0.9em;
    margin-bottom: 4px;
}
.mendelian-warning-popup .motif-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2px 12px;
    font-size: 0.88em;
}
.mendelian-warning-popup .motif-grid .motif-item {
    display: flex;
    justify-content: space-between;
}

/* Invisible tables for vertical alignment */
.invisible-table {
    border-collapse: collapse;
    border: none;
    width: 100%;
}
/* The second selector is for the copy nested in the expanded detail row, where the bare class
   would lose to `#results-table tbody td`'s 5px 8px padding. */
.invisible-table td,
#results-table .invisible-table td {
    border: none;
    padding: 1px 8px 1px 0;
    vertical-align: top;
}
/* Affected Unsolved table columns */
.affected-unsolved-table .aff-allele { white-space: nowrap; }
.affected-unsolved-table .aff-sample { white-space: nowrap; }

.val-high    { background: #ffcdd2; }
.val-medium  { background: #fff9c4; }
.val-neutral { background: transparent; }

/* === Per-sample sub-table inside detail expansion === */
.sample-subtable {
    width: 100%;
    font-family: inherit;
    font-size: 0.95em;
    border-collapse: collapse;
    margin-top: 6px;
}
/* The per-sample sub-table is rendered inside #results-table's tbody, so these rules have to
   out-specify the #results-table ones above (an ID beats a class); without the #results-table
   prefix the nested header would inherit the main table's sticky positioning and colors. */
#results-table .sample-subtable thead th {
    background: #f0f0f0;
    font-size: 0.9em;
    color: #666;
    padding: 3px 6px;
    text-align: left;
    font-weight: 600;
    position: static;
}
#results-table .sample-subtable tr { border-bottom: 1px solid #f0f0f0; }
#results-table .sample-subtable td { padding: 2px 6px; white-space: nowrap; }
/* The detail panel's phenotype-scores table is nested the same way, so its header would also stick
   and draw over the main header; the transparent background lets its header row's green show */
#results-table .phenotype-scores-table thead th { position: static; background: transparent; }

/* Row coloring by affected/analysis status */
.sample-affected-unsolved { color: #c62828; font-weight: 600; }
.sample-affected-solved   { color: #b8860b; }
.sample-unaffected        { color: #2e8b39; }
.sample-unknown           { color: #78909c; }

/* === Pagination === */
.pagination-container {
    margin-top: 1em;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    gap: 1em;
    flex-wrap: wrap;
}
.total-results {
    color: #666; font-size: 1.1em;
    white-space: nowrap; order: 1;
}
.export-selector {
    display: flex; align-items: center; gap: 10px;
    white-space: nowrap; order: 2;
}
.export-selector .export-label {
    color: #666;
}
.page-size-selector {
    display: flex; align-items: center; gap: 10px;
    color: #666; font-size: 1em;
    white-space: nowrap; order: 3;
}
.pagination-controls {
    display: flex; align-items: center; gap: 8px;
    white-space: nowrap; order: 4;
}
.pagination-controls .ui.button {
    padding: 8px; min-width: 36px;
    background: white; border: 1px solid #ddd; box-shadow: none;
}
.pagination-controls .ui.button:hover { background: #f8f8f8; }
.pagination-controls .ui.button.disabled { opacity: 0.5; }
.page-input {
    width: 55px; text-align: center;
    border: 1px solid #ddd; border-radius: 4px;
    padding: 6px 4px; font-size: 0.9em;
}

/* === Loading & Error === */
.loading-indicator {
    display: flex; align-items: center;
    color: #888; font-size: 1.1em; font-weight: 300;
}
.loading-indicator .ui.loader { margin: 0; margin-right: 20px; }
#results-container.loading { opacity: 0.6; pointer-events: none; }

/* Summary Charts */
#summary-charts-container {
    background: #f9fafb;
    border: 1px solid #e0e0e0;
    border-radius: 6px;
    padding: 20px;
    margin-top: 20px;
}
#summary-charts-container .column {
    padding: 10px 20px;
}

/* === Sample QC and QC2 pages === */
.qc-section {
    margin-bottom: 50px;
}
.qc-section-title {
    font-size: 1.2em;
    font-weight: 600;
    color: #333;
    margin-bottom: 15px;
    margin-top: 20px;
}
.qc-charts-row {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    justify-content: flex-start;
}
.qc-chart-container {
    flex: 1 1 180px;
    min-width: 160px;
    max-width: 220px;
    position: relative;
}
.qc-chart-canvas-wrapper {
    height: 250px;
    position: relative;
}
.qc-chart-canvas-wrapper canvas {
    width: 100% !important;
    height: 100% !important;
}
.qc-bin-label {
    text-align: center;
    font-weight: 600;
    color: #555;
    margin-bottom: 5px;
    font-size: 0.95em;
}
#qc-loading {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px;
    color: #888;
    font-size: 1.1em;
}
#qc-loading .ui.loader {
    margin-right: 15px;
}
#qc-error {
    display: none;
    color: #c62828;
    padding: 20px;
    text-align: center;
}
.qc-top-table {
    margin-top: 10px;
    font-size: 0.75em;
    width: 100%;
    border-collapse: collapse;
}
.qc-top-table th {
    background: #f5f5f5;
    padding: 3px 5px;
    text-align: left;
    font-weight: 600;
    border-bottom: 1px solid #ddd;
}
.qc-top-table td {
    padding: 2px 5px;
    border-bottom: 1px solid #eee;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 120px;
}
.qc-top-table tr:hover {
    background: #f9f9f9;
}
.qc-table-title {
    font-size: 0.8em;
    color: #666;
    margin-top: 8px;
    margin-bottom: 4px;
    font-weight: 500;
}

</style>

</head>
